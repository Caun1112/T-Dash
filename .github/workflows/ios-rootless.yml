name: Build iOS rootless DEB
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version
        required: true
        default: '0.1.0'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install package tools
        run: brew install ldid dpkg
      - name: Test protocol and trip logic
        run: bash ios/scripts/test.sh
      - name: Build and verify rootless package
        env:
          TDASH_VERSION: ${{ inputs.version }}
        run: bash ios/scripts/build.sh
      - name: Render and check native landscape and portrait layouts
        run: bash ios/scripts/preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TDash-rootless-${{ inputs.version }}
          path: ios/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TDash-native-previews
          path: ios/.build/previews/
          if-no-files-found: error
